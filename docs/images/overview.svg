<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 900" width="1600" height="900" font-family="JetBrainsMono Nerd Font, JetBrains Mono, DejaVu Sans Mono, monospace">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#232433"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#7a5230" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a5230" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roomA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4261"/>
      <stop offset="1" stop-color="#262a3f"/>
    </linearGradient>
    <linearGradient id="roomB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c9a8"/>
      <stop offset="1" stop-color="#a99572"/>
    </linearGradient>
    <!-- illustrated presenter, 400x400 -->
    <symbol id="personA" viewBox="0 0 400 400">
      <rect width="400" height="400" fill="url(#roomA)"/>
      <rect x="20" y="40" width="110" height="150" rx="4" fill="#2b2f45"/>
      <rect x="30" y="52" width="14" height="56" fill="#f7768e"/><rect x="48" y="58" width="12" height="50" fill="#e0af68"/>
      <rect x="64" y="50" width="16" height="58" fill="#7aa2f7"/><rect x="84" y="62" width="12" height="46" fill="#9ece6a"/>
      <rect x="100" y="56" width="14" height="52" fill="#bb9af7"/>
      <rect x="30" y="122" width="90" height="4" fill="#414868"/>
      <rect x="300" y="30" width="70" height="90" rx="6" fill="#414868"/>
      <path d="M320 60h30M320 75h22M320 90h26" stroke="#7aa2f7" stroke-width="5" stroke-linecap="round"/>
      <path d="M60 400 C70 300 130 270 200 270 C270 270 330 300 340 400Z" fill="#2ac3de"/>
      <path d="M170 270 L200 320 L230 270Z" fill="#1f8ca3"/>
      <rect x="180" y="225" width="40" height="55" rx="14" fill="#e8b48f"/>
      <ellipse cx="200" cy="180" rx="66" ry="76" fill="#f2c29e"/>
      <path d="M134 170 C130 100 180 88 205 92 C250 96 276 125 266 172 C258 140 236 128 200 128 C168 128 146 140 134 170Z" fill="#4a2f22"/>
      <circle cx="176" cy="185" r="7" fill="#2b2b2b"/><circle cx="224" cy="185" r="7" fill="#2b2b2b"/>
      <path d="M180 220 Q200 236 220 220" stroke="#b3624b" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="160" cy="207" rx="10" ry="6" fill="#f0a08a" opacity="0.6"/><ellipse cx="240" cy="207" rx="10" ry="6" fill="#f0a08a" opacity="0.6"/>
    </symbol>
    <symbol id="personB" viewBox="0 0 640 360">
      <rect width="640" height="360" fill="url(#roomB)"/>
      <rect x="430" y="30" width="170" height="120" rx="6" fill="#f4ecdc"/>
      <path d="M450 120 L500 70 L540 105 L565 85 L590 120Z" fill="#7fae7a"/>
      <circle cx="565" cy="60" r="12" fill="#e0af68"/>
      <rect x="40" y="200" width="70" height="160" fill="#8a7454"/>
      <ellipse cx="75" cy="190" rx="50" ry="38" fill="#5f8f55"/><ellipse cx="55" cy="160" rx="30" ry="26" fill="#6fa363"/>
      <path d="M180 360 C190 270 250 245 320 245 C390 245 450 270 460 360Z" fill="#bb9af7"/>
      <rect x="300" y="205" width="40" height="50" rx="14" fill="#a8704f"/>
      <ellipse cx="320" cy="160" rx="62" ry="72" fill="#b97d5a"/>
      <path d="M252 175 C238 95 300 70 330 78 C380 86 400 130 388 180 C396 120 360 100 320 104 C290 106 262 120 252 175Z" fill="#1d1d1d"/>
      <circle cx="298" cy="163" r="16" fill="none" stroke="#1d1d1d" stroke-width="4"/>
      <circle cx="342" cy="163" r="16" fill="none" stroke="#1d1d1d" stroke-width="4"/>
      <path d="M314 163h12" stroke="#1d1d1d" stroke-width="4"/>
      <circle cx="298" cy="164" r="5" fill="#1d1d1d"/><circle cx="342" cy="164" r="5" fill="#1d1d1d"/>
      <path d="M300 198 Q320 212 340 198" stroke="#6b3a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    </symbol>
    <clipPath id="circ"><circle cx="1365" cy="655" r="165"/></clipPath>
    <clipPath id="rectcam"><rect x="70" y="520" width="384" height="216" rx="2"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- wallpaper -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- bar -->
  <rect width="1600" height="34" fill="#13131a"/>
  <g font-size="15" fill="#a9b1d6">
    <text x="22" y="23" fill="#7aa2f7">1</text><text x="48" y="23">2</text><text x="74" y="23">3</text>
    <circle cx="722" cy="17.5" r="8" fill="none" stroke="#f7768e" stroke-width="2"/>
    <circle cx="722" cy="17.5" r="3.6" fill="#f7768e"/>
    <text x="744" y="23">2026-10-11 15:01</text>
    <path d="M1490 22 a9 9 0 0 1 18 0" fill="none" stroke="#a9b1d6" stroke-width="2"/>
    <rect x="1530" y="11" width="26" height="13" rx="3" fill="none" stroke="#a9b1d6" stroke-width="2"/>
    <rect x="1533" y="14" width="17" height="7" fill="#9ece6a"/>
  </g>

  <!-- editor window -->
  <g filter="url(#shadow)">
    <rect x="40" y="56" width="1000" height="700" rx="10" fill="#1a1b26" stroke="#414868" stroke-width="2"/>
  </g>
  <g font-size="17">
    <text x="70" y="96" fill="#565f89"># demo.sh – what we are explaining today</text>
    <text x="70" y="128"><tspan fill="#bb9af7">record_demo</tspan><tspan fill="#c0caf5">() {</tspan></text>
    <text x="70" y="160"><tspan fill="#c0caf5">  </tspan><tspan fill="#bb9af7">local</tspan><tspan fill="#c0caf5"> out=</tspan><tspan fill="#9ece6a">"$HOME/Videos"</tspan></text>
    <text x="70" y="192"><tspan fill="#c0caf5">  </tspan><tspan fill="#bb9af7">for</tspan><tspan fill="#c0caf5"> step </tspan><tspan fill="#bb9af7">in</tspan><tspan fill="#c0caf5"> intro setup run outro; </tspan><tspan fill="#bb9af7">do</tspan></text>
    <text x="70" y="224"><tspan fill="#c0caf5">    </tspan><tspan fill="#7aa2f7">echo</tspan><tspan fill="#9ece6a"> "== $step =="</tspan></text>
    <text x="70" y="256"><tspan fill="#c0caf5">    </tspan><tspan fill="#7aa2f7">show_slide</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#9ece6a">"$step"</tspan><tspan fill="#c0caf5"> &amp;&amp; </tspan><tspan fill="#7aa2f7">sleep</tspan><tspan fill="#ff9e64"> 2</tspan></text>
    <text x="70" y="288"><tspan fill="#c0caf5">  </tspan><tspan fill="#bb9af7">done</tspan></text>
    <text x="70" y="320" fill="#c0caf5">}</text>
    <text x="70" y="384" fill="#565f89"># slides</text>
    <text x="70" y="416"><tspan fill="#7aa2f7">show_slide</tspan><tspan fill="#c0caf5">() { </tspan><tspan fill="#7aa2f7">printf</tspan><tspan fill="#9ece6a"> '\n  %s\n'</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#9ece6a">"$1"</tspan><tspan fill="#c0caf5">; }</tspan></text>
    <text x="70" y="480"><tspan fill="#7aa2f7">record_demo</tspan></text>
  </g>

  <!-- rectangle camera (B) -->
  <g filter="url(#shadow)">
    <rect x="66" y="516" width="392" height="224" rx="3" fill="#00aaff"/>
  </g>
  <g clip-path="url(#rectcam)"><use href="#personB" x="70" y="520" width="384" height="216"/></g>

  <!-- multicam TUI (floating terminal, focused) -->
  <g filter="url(#shadow)">
    <rect x="1070" y="56" width="500" height="372" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2"/>
  </g>
  <g font-size="15" fill="#c0caf5">
    <text x="1092" y="92"><tspan fill="#7aa2f7" font-weight="bold">multicam</tspan><tspan fill="#737aa2"> 1.2.0  </tspan><tspan fill="#f7768e">●</tspan><tspan fill="#f7768e" font-weight="bold"> RECORDING</tspan><tspan font-weight="bold"> 00:42</tspan></text>
    <text x="1092" y="116" fill="#737aa2">Full screen: DP-1</text>
    <rect x="1088" y="136" width="464" height="50" fill="#283457"/>
    <rect x="1088" y="136" width="4" height="50" fill="#7aa2f7"/>
    <text x="1100" y="156"><tspan fill="#7aa2f7" font-weight="bold">A</tspan>  <tspan font-weight="bold">HD Pro Webcam C920</tspan></text>
    <text x="1112" y="178" fill="#737aa2">circle · ring <tspan fill="#ff3399">■</tspan> 4 px · 240 px</text>
    <text x="1100" y="208" fill="#737aa2">B  FaceTime HD Camera</text>
    <text x="1112" y="230" fill="#737aa2">rectangle · ring <tspan fill="#00aaff">■</tspan> 4 px · 216 px</text>
    <text x="1100" y="266"><tspan fill="#737aa2">Mode</tspan>  <tspan fill="#7aa2f7" font-weight="bold">[MOVE]</tspan>  <tspan fill="#737aa2">size</tspan></text>
    <rect x="1092" y="284" width="456" height="1.5" fill="#414868"/>
    <g font-size="13">
      <rect x="1092" y="298" width="32" height="20" fill="#24283b"/><text x="1097" y="313" fill="#7aa2f7" font-weight="bold">Tab</text><text x="1130" y="313" fill="#737aa2">camera</text>
      <rect x="1190" y="298" width="40" height="20" fill="#24283b"/><text x="1194" y="313" fill="#7aa2f7" font-weight="bold">←↑↓→</text><text x="1236" y="313" fill="#737aa2">move/size</text>
      <rect x="1322" y="298" width="16" height="20" fill="#24283b"/><text x="1326" y="313" fill="#7aa2f7" font-weight="bold">m</text><text x="1344" y="313" fill="#737aa2">mode</text>
      <rect x="1092" y="326" width="32" height="20" fill="#24283b"/><text x="1097" y="341" fill="#7aa2f7" font-weight="bold">1-9</text><text x="1130" y="341" fill="#737aa2">position</text>
      <rect x="1206" y="326" width="16" height="20" fill="#24283b"/><text x="1210" y="341" fill="#7aa2f7" font-weight="bold">s</text><text x="1228" y="341" fill="#737aa2">shape</text>
      <rect x="1282" y="326" width="16" height="20" fill="#24283b"/><text x="1286" y="341" fill="#7aa2f7" font-weight="bold">r</text><text x="1304" y="341" fill="#737aa2">ring</text>
      <rect x="1350" y="326" width="16" height="20" fill="#24283b"/><text x="1354" y="341" fill="#7aa2f7" font-weight="bold">q</text><text x="1372" y="341" fill="#737aa2">stop</text>
    </g>
  </g>

  <!-- circle camera (A) -->
  <g filter="url(#shadow)">
    <circle cx="1365" cy="655" r="169" fill="#ff3399"/>
  </g>
  <g clip-path="url(#circ)"><use href="#personA" x="1200" y="490" width="330" height="330"/></g>
</svg>
