<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 760" width="1000" height="760" font-family="JetBrainsMono Nerd Font, JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1000" height="760" fill="#232433"/>
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="940" height="700" rx="12" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2"/>
  </g>
  <g fill="#c0caf5">
    <!-- header -->
    <rect x="60" y="62" width="16" height="12" rx="2" fill="#7aa2f7"/><path d="M76 68 l7 -5 v10z" fill="#7aa2f7"/>
    <text x="98" y="76"><tspan fill="#7aa2f7" font-weight="bold">multicam</tspan><tspan fill="#737aa2">  1.3.0</tspan></text>
    <text x="60" y="100" fill="#737aa2">screen + cameras + microphone</text>

    <!-- cameras -->
    <text x="60" y="144" fill="#737aa2" font-weight="bold">CAMERAS</text>
    <rect x="60" y="154" width="620" height="26" fill="#283457"/>
    <rect x="60" y="154" width="4" height="26" fill="#7aa2f7"/>
    <text x="70" y="173" font-weight="bold">Camera A</text>
    <text x="270" y="173" font-weight="bold">HD Pro Webcam C920</text>
    <text x="460" y="173" fill="#737aa2">←→</text>
    <text x="90" y="202" fill="#737aa2">Shape</text>
    <text x="270" y="202"><tspan fill="#7aa2f7">●</tspan> <tspan font-weight="bold">circle</tspan>   <tspan fill="#737aa2">○ rectangle</tspan></text>
    <text x="90" y="228" fill="#737aa2">Ring</text>
    <text x="270" y="228"><tspan fill="#7aa2f7">●</tspan> on</text>
    <text x="90" y="254" fill="#737aa2">Border colour</text>
    <rect x="270" y="240" width="30" height="18" fill="#ff3399"/><text x="310" y="254">#ff3399</text>
    <text x="90" y="280" fill="#737aa2">Thickness</text>
    <rect x="270" y="272" width="40" height="3" fill="#7aa2f7"/><rect x="310" y="272" width="80" height="3" fill="#414868"/><text x="400" y="280">4 px</text>
    <text x="90" y="306" fill="#737aa2">Remove background</text>
    <text x="270" y="306" fill="#737aa2">○ off</text>

    <text x="70" y="344">Camera B</text>
    <text x="270" y="344" font-weight="bold">FaceTime HD Camera</text>
    <text x="90" y="370" fill="#737aa2">Shape</text>
    <text x="270" y="370"><tspan fill="#737aa2">○ circle</tspan>   <tspan fill="#7aa2f7">●</tspan> <tspan font-weight="bold">rectangle</tspan></text>
    <text x="90" y="396" fill="#737aa2">Border colour</text>
    <rect x="270" y="382" width="30" height="18" fill="#00aaff"/><text x="310" y="396">#00aaff</text>

    <!-- audio -->
    <text x="60" y="440" fill="#737aa2" font-weight="bold">AUDIO</text>
    <text x="70" y="468">Microphone</text><text x="270" y="468">Audient iD14</text>
    <text x="70" y="494">Desktop audio</text><text x="270" y="494"><tspan fill="#7aa2f7">●</tspan> on</text>

    <!-- capture -->
    <text x="60" y="538" fill="#737aa2" font-weight="bold">CAPTURE</text>
    <text x="70" y="566">Record</text>
    <text x="270" y="566"><tspan fill="#7aa2f7">●</tspan> <tspan font-weight="bold">full screen</tspan>   <tspan fill="#737aa2">○ area   ○ window</tspan></text>
    <text x="70" y="592">Screen</text><text x="270" y="592">focused (DP-1)</text>

    <!-- button -->
    <text x="70" y="636" fill="#7aa2f7" font-weight="bold">[ ▶  Preview cameras ]</text>
    <text x="320" y="636" fill="#737aa2">the recording does not start yet</text>

    <!-- footer -->
    <rect x="60" y="660" width="880" height="1.5" fill="#414868"/>
    <g font-size="15">
      <rect x="60" y="676" width="30" height="24" fill="#24283b"/><text x="66" y="693" fill="#7aa2f7" font-weight="bold">↑↓</text><text x="98" y="693" fill="#737aa2">row</text>
      <rect x="150" y="676" width="30" height="24" fill="#24283b"/><text x="156" y="693" fill="#7aa2f7" font-weight="bold">←→</text><text x="188" y="693" fill="#737aa2">change</text>
      <rect x="268" y="676" width="22" height="24" fill="#24283b"/><text x="274" y="693" fill="#7aa2f7" font-weight="bold">⏎</text><text x="298" y="693" fill="#737aa2">select</text>
      <rect x="378" y="676" width="30" height="24" fill="#24283b"/><text x="384" y="693" fill="#7aa2f7" font-weight="bold">F5</text><text x="416" y="693" fill="#737aa2">preview</text>
      <rect x="506" y="676" width="22" height="24" fill="#24283b"/><text x="512" y="693" fill="#7aa2f7" font-weight="bold">S</text><text x="536" y="693" fill="#737aa2">settings</text>
      <rect x="630" y="676" width="22" height="24" fill="#24283b"/><text x="636" y="693" fill="#7aa2f7" font-weight="bold">U</text><text x="660" y="693" fill="#737aa2">update</text>
      <rect x="740" y="676" width="22" height="24" fill="#24283b"/><text x="746" y="693" fill="#7aa2f7" font-weight="bold">q</text><text x="770" y="693" fill="#737aa2">quit</text>
    </g>
  </g>
</svg>
